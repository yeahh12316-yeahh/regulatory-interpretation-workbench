name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  backend-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config
      - name: Build and start the local stack
        run: docker compose up -d --build
      - name: Check Web and API health
        run: |
          for attempt in $(seq 1 60); do
            api_ok=0
            web_ok=0
            curl -fsS http://localhost:8000/health >/tmp/api-health.json && api_ok=1 || true
            curl -fsS http://localhost:8080/ >/tmp/web-index.html && web_ok=1 || true
            if [ "$api_ok" = "1" ] && [ "$web_ok" = "1" ]; then
              grep -q 'regulatory-interpretation-api' /tmp/api-health.json
              grep -q '外规解读智能体工作台' /tmp/web-index.html
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color api worker web
          exit 1
      - name: Tear down stack
        if: always()
        run: docker compose down -v

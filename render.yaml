# Render Blueprint for the free public demo deployment.
# Free-tier limitations: no separate Worker, no persistent disk, sleeping web
# service, expiring Postgres, and non-persistent Key Value. Do not treat this
# configuration as a production data-retention environment.
services:
  - type: web
    name: regulatory-interpretation-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_ORIGIN
        value: https://yeahh12316-yeahh.github.io
      - key: DATA_DIR
        value: /tmp/regulatory-workbench
      - key: PRIVATE_MODE
        value: "false"
      - key: PUBLIC_GUEST_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: regulatory-interpretation-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_READINESS_REQUIRED
        value: "true"
      - key: LOG_FORMAT
        value: json
      - key: PROMETHEUS_ENABLED
        value: "true"
      - key: WORKFLOW_EXECUTION_MODE
        value: inline
      - key: WORKFLOW_ALLOW_INLINE_FALLBACK
        value: "true"
      - key: ENABLE_S5
        value: "false"
      - key: ENABLE_OCR_FALLBACK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://nova.deloitte.com.cn/del/v1/chat/completions
      - key: LLM_MODEL
        value: DeepSeek-V4-Flash
      - key: LLM_TIMEOUT_SECONDS
        value: "180"
      - key: LLM_REVIEWER_REQUIRED
        value: "true"
      - key: LLM_API_KEY
        sync: false

  - type: keyvalue
    name: regulatory-interpretation-redis
    plan: free
    region: singapore
    persistenceMode: off
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render private service connections

databases:
  - name: regulatory-interpretation-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"

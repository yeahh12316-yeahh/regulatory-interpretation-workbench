# Render Blueprint for the public backend.
# Secrets are intentionally prompted during the first Blueprint creation.
services:
  - type: web
    name: regulatory-interpretation-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: regulatory-data
      mountPath: /data/regulatory-workbench
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: WEB_ORIGIN
        value: https://yeahh12316-yeahh.github.io
      - key: DATA_DIR
        value: /data/regulatory-workbench
      - key: PRIVATE_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: regulatory-interpretation-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_READINESS_REQUIRED
        value: "true"
      - key: LOG_FORMAT
        value: json
      - key: PROMETHEUS_ENABLED
        value: "true"
      - key: WORKFLOW_EXECUTION_MODE
        value: celery
      - key: WORKFLOW_ALLOW_INLINE_FALLBACK
        value: "false"
      - key: ENABLE_S5
        value: "false"
      - key: ENABLE_OCR_FALLBACK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://nova.deloitte.com.cn/del/v1/chat/completions
      - key: LLM_MODEL
        value: DeepSeek-V4-Flash
      - key: LLM_REVIEWER_REQUIRED
        value: "true"
      - key: LLM_API_KEY
        sync: false

  - type: worker
    name: regulatory-interpretation-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: regulatory-interpretation-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: regulatory-interpretation-redis
          type: keyvalue
          property: connectionString
      - key: DATA_DIR
        value: /data/regulatory-workbench
      - key: WORKFLOW_EXECUTION_MODE
        value: celery

  - type: keyvalue
    name: regulatory-interpretation-redis
    plan: starter
    region: singapore
    persistenceMode: journal-snapshot
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render private service connections

databases:
  - name: regulatory-interpretation-postgres
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 15
